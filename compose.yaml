services:
  carfreeks:
    build: .
    image: carfreeks:latest
    container_name: carfreeks
    restart: unless-stopped
    ports:
      - "${CARFREEKS_BIND_ADDRESS:-127.0.0.1}:${CARFREEKS_PORT:-8080}:8080"
    environment:
      CARFREEKS_SECRET_KEY: "${CARFREEKS_SECRET_KEY:?Set CARFREEKS_SECRET_KEY in the stack environment}"
      CARFREEKS_DATA_DIR: /data
      CARFREEKS_COOKIE_SECURE: "${CARFREEKS_COOKIE_SECURE:-false}"
    volumes:
      - carfreeks-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  carfreeks-notifications:
    image: carfreeks:latest
    container_name: carfreeks-notifications
    command: ["python", "notifications.py"]
    restart: unless-stopped
    environment:
      CARFREEKS_SECRET_KEY: "${CARFREEKS_SECRET_KEY:?Set CARFREEKS_SECRET_KEY in the stack environment}"
      CARFREEKS_DATA_DIR: /data
      CARFREEKS_NOTIFICATION_INTERVAL_SECONDS: "${CARFREEKS_NOTIFICATION_INTERVAL_SECONDS:-300}"
    volumes:
      - carfreeks-data:/data
    depends_on:
      carfreeks:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  carfreeks-data:
